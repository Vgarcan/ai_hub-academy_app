name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite:
    name: SQLite / Django ${{ matrix.django-label }} (Python 3.12)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - django-label: "5.2 LTS"
            django-spec: "Django>=5.2,<5.3"
          - django-label: "current"
            django-spec: "Django>=6.0,<7.0"
    env:
      DEBUG: "True"
      SECRET_KEY: ci-sqlite-not-for-production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "${{ matrix.django-spec }}"

      - name: Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite
        run: python manage.py test --verbosity=2

      # The README's manual installation sequence, with real commands, on a
      # throwaway database. It covers the interrupted state (a seed refused for
      # lack of a scope must write nothing), a fresh install, and a repeat.
      - name: Installation smoke test (documented sequence, disposable database)
        env:
          DATABASE_URL: ""
          DATABASE_ENGINE: sqlite
          SQLITE_NAME: ${{ runner.temp }}/install-smoke.sqlite3
          DJANGO_SUPERUSER_PASSWORD: ci-smoke-test-only
        run: |
          python manage.py migrate --noinput
          if python manage.py seed_academy_training_data; then
            echo "The seed must refuse to run without an ApplicationScope"; exit 1
          fi
          python manage.py bootstrap_academy_scope
          python manage.py seed_academy_training_data
          python manage.py import_academy_docs
          python manage.py createsuperuser --noinput --username admin --email admin@example.com
          # Repeating every step must succeed and must not duplicate anything.
          python manage.py bootstrap_academy_scope
          python manage.py seed_academy_training_data
          python manage.py import_academy_docs
          python manage.py check

  postgresql:
    name: PostgreSQL 16 + pgvector 0.8.6 / concurrency tests (Python 3.12)
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostgreSQL 16 with the pgvector extension preinstalled. Pinned to an
        # exact patch version, never `latest`: the S-24 backend asserts a
        # minimum pgvector version and its HNSW behaviour is validated against
        # this one, so a floating tag would silently change what CI proves.
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_DB: ai_hub_ci
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEBUG: "True"
      SECRET_KEY: ci-postgresql-not-for-production
      DATABASE_ENGINE: postgresql
      POSTGRES_DB: ai_hub_ci
      POSTGRES_USER: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      DB_CONN_MAX_AGE: "0"
      DB_CONN_HEALTH_CHECKS: "True"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run full suite with PostgreSQL locking
        run: python manage.py test --verbosity=2
