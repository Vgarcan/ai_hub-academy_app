<div id="chat-widget" role="dialog" aria-label="AI Hub Documentation Assistant" aria-modal="false">

  <!-- header -->
  <div class="widget-header">
    <div class="widget-header-icon">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </div>
    <div class="widget-header-info">
      <strong>AI Hub Assistant</strong>
      <span>Ask anything about AI Hub</span>
    </div>
    <div class="widget-status-dot" title="Online"></div>

    <!-- expand / shrink -->
    <button class="widget-expand" id="widget-expand" title="Expand"
            aria-label="Expand chat window">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 3 21 3 21 9"/>
        <polyline points="9 21 3 21 3 15"/>
        <line x1="21" y1="3" x2="14" y2="10"/>
        <line x1="3" y1="21" x2="10" y2="14"/>
      </svg>
    </button>

    <button class="widget-close" id="widget-close" aria-label="Close assistant">&#10005;</button>
  </div>

  <!-- message area -->
  <div class="widget-messages" id="widget-messages">
    <div class="wm-welcome" id="widget-welcome">
      <span class="wm-welcome-icon">&#129302;</span>
      <h4>AI Hub Documentation Assistant</h4>
      <p>Ask me anything — agents, pipelines, GAME loops, setup or configuration.</p>
      <div class="wm-suggestions">
        <button class="wm-suggestion">What is the GAME loop?</button>
        <button class="wm-suggestion">How do I create an agent?</button>
        <button class="wm-suggestion">Pipeline vs GAME &#8212; what&#39;s the difference?</button>
        <button class="wm-suggestion">How do input/output contracts work?</button>
      </div>
    </div>
  </div>

  <!-- input -->
  <div class="widget-input-area">
    <div class="widget-input-row">
      <textarea
        id="widget-input"
        rows="1"
        placeholder="Ask about AI Hub&#8230;"
        aria-label="Your question"
        autocomplete="off"
        spellcheck="false"
      ></textarea>
      <button id="widget-send" aria-label="Send">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <p class="widget-footer">
      Enter to send &middot; Shift+Enter for new line &middot; Ctrl+/ to toggle &middot;
      <a href="/assistant/" target="_blank">Full history &rarr;</a>
    </p>
  </div>

</div>
